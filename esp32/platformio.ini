; PlatformIO project for the Elegoo ESP32 (USB-C) dev board.
;
; healthtracker_core (in lib/) is a set of symlinks into the shared, platform-
; agnostic sources at ../include and ../src — the same OAuth/Google Health
; API client code the desktop build uses. Edit the originals there; these
; symlinks pick the changes up automatically. Only this esp32/ directory's
; own files (src/main.cpp, src/esp32_http_client.*) are ESP32-specific.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200

build_flags =
    -std=gnu++17
    -Wall
build_unflags =
    -std=gnu++11

lib_ldf_mode = deep+
lib_extra_dirs = lib
lib_deps =
    johboh/nlohmann-json @ 3.11.3
    adafruit/Adafruit GFX Library @ ^1.12.6
    adafruit/Adafruit ILI9341 @ ^1.6.3
